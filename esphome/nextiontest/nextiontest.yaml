esphome:
  name: nextiontest

esp8266:
  board: esp01_1m

# Enable logging
logger:
  baud_rate: 0
# modulo WEBSERVER
web_server:
 port: 80

api:

ota:
  password: "367993d932fca9ccce4b24f16f6291ec"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Nextiontest Fallback Hotspot"
    password: "k8oCYbHgqhgD"

captive_portal:

uart:
  id: u1
  rx_pin: GPIO3
  tx_pin: GPIO2
  baud_rate: 9600 
  
display:
  - platform: nextion
    id: nextion1
    uart_id: u1
    update_interval: 3s
    lambda: |-
      it.set_wait_for_ack(false);
      it.set_component_text_printf("t1","%s","Hello World!");
      auto time_text = id(sntp_time).now().strftime("%H:%M");
      it.set_component_text("time", time_text.c_str());
      it.set_component_text_printf("page0.consumo","%.1f C",id(consumo).state);
      it.set_component_text_printf("termocamino","%.1f C",id(temperature_termocamino).state);  
    
time:
  - platform: sntp
    id: sntp_time 

sensor:
  - platform: homeassistant
    id: consumo
    name: "Consumo"
    entity_id: sensor.tasmota_sdm220_energy_power
    
  - platform: homeassistant   # Inside temperature
    id: temperature_termocamino
    name: "Temperatura termocamino"
    entity_id: sensor.tasmota_termocamino_e_boiler_solare_ds18b20_2_temperature

binary_sensor:   
  - platform: nextion
    page_id: 0
    component_id: 5
    id: beep_button
    name: "beeper"